<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found · Aditya Joshi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/avatar.svg">
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <style>
    :root { --bg: #0b1120; --text: #e6edf7; --muted: #94a3b8; --accent: #2dd4bf; --on-accent: #042f2e; color-scheme: dark; }
    :root[data-theme='light'] { --bg: #f8fafc; --text: #0f172a; --muted: #475569; --accent: #0f766e; --on-accent: #fff; color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
      background: var(--bg); color: var(--text); text-align: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    img { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 1.5rem; display: block; }
    .code { font-family: ui-monospace, Consolas, monospace; color: var(--accent); margin: 0 0 .5rem; }
    h1 { margin: 0; font-size: clamp(1.75rem, 5vw, 2.5rem); letter-spacing: -0.02em; }
    p { color: var(--muted); max-width: 28rem; margin: 1rem auto 2rem; line-height: 1.6; }
    a {
      display: inline-block; padding: .75rem 1.5rem; border-radius: 999px;
      background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none;
    }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/avatar.svg" alt="" width="120" height="120">
    <p class="code">404</p>
    <h1>This page doesn't exist.</h1>
    <p>The link may be broken or the page may have moved. Everything about me is on the home page.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
