<section id="hero" class="hero container" aria-label="Introduction">
  <img class="avatar" [src]="profile.avatar" alt="" width="160" height="160" />
  <p class="eyebrow">Hi, I'm</p>
  <h1>{{ profile.name }}</h1>
  <p class="headline">{{ profile.headline }}</p>
</section>

@for (section of sections; track section.id) {
  <section class="section container" [id]="section.id" [attr.aria-labelledby]="section.id + '-title'">
    <app-section-header [sectionId]="section.id" />
    <p class="placeholder">{{ section.label }} content is built in step 3.</p>
  </section>
}
